  <style>
    /* Design tokeny – Minimalism & Swiss Style (ui-ux-pro-max), monochrom + modrý akcent pro fokus */
    :root {
      --bg: #FAFAFA;
      --fg: #09090B;
      --muted-fg: #52525B;
      --card: #FFFFFF;
      --border: #E4E4E7;
      --card-hover: #F4F4F5;
      --primary: #18181B;
      --on-primary: #FFFFFF;
      --primary-hover: #27272A;
      --ring: #2563EB;
      --glow: rgba(24, 24, 27, .06);
      --wave: rgba(9, 9, 11, .28);
      --shadow: 0 1px 2px rgba(9, 9, 11, .05);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --radius: 14px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090B;
        --fg: #FAFAFA;
        --muted-fg: #A1A1AA;
        --card: #18181B;
        --border: #27272A;
        --card-hover: #1F1F23;
        --primary: #FAFAFA;
        --on-primary: #09090B;
        --primary-hover: #E4E4E7;
        --ring: #60A5FA;
        --glow: rgba(250, 250, 250, .05);
        --wave: rgba(250, 250, 250, .3);
        --shadow: none;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 60% at 50% 0%, var(--glow), transparent 70%),
        var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding:
        max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Dvě vlny od fotky po načtení – „signál z NFC“, proběhne jednou */
    .avatar { position: relative; }
    .avatar::before, .avatar::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1.5px solid var(--wave);
      opacity: 0;
      pointer-events: none;
      animation: wave 1.6s cubic-bezier(.2, .6, .3, 1) .5s both;
    }
    .avatar::after { animation-delay: .85s; }
    @keyframes wave {
      0%   { opacity: 0; transform: scale(1); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: scale(1.4); }
    }

    .photo {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--border);
      box-shadow: 0 0 0 1px var(--border), 0 0 0 6px var(--bg), 0 0 0 7px var(--border);
    }
    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02); /* schová světlý okraj kruhu z původní fotky */
    }

    h1 {
      margin: 28px 0 4px;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .role {
      margin: 0;
      color: var(--muted-fg);
      font-size: 16px;
    }

    .actions {
      list-style: none;
      margin: 36px 0 0;
      padding: 0;
      width: 100%;
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 56px;
      padding: 0 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      box-shadow: var(--shadow);
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color .2s ease, border-color .2s ease, transform .4s var(--spring);
    }
    /* Stisk: rychlé zmáčknutí, pružný návrat */
    .btn:active { transform: scale(.97); transition-duration: .2s, .2s, .08s; }
    .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .btn--primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
    }
    /* Spotify – značková zelená, pilulka, černý text (kontrast 10:1) */
    .btn--spotify {
      background: #1ED760;
      border-color: #1ED760;
      color: #000;
      border-radius: 999px;
      font-weight: 700;
    }
    .btn--spotify svg:first-child { width: 24px; height: 24px; }
    /* Jednorázový odlesk přes Spotify, aby si ho člověk všiml */
    .btn--spotify { position: relative; overflow: hidden; }
    .btn--spotify::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%);
      transform: translateX(-110%);
      pointer-events: none;
      animation: shine 1s ease-in-out .45s both;
    }
    @keyframes shine { to { transform: translateX(110%); } }
    /* OP.GG – jejich modrá, ztmavená kvůli kontrastu bílého textu (4,6:1) */
    .btn--opgg {
      background: #4171D6;
      border-color: #4171D6;
      color: #FFF;
      border-radius: 999px;
      font-weight: 700;
    }
    /* Poloviční tlačítka vedle sebe */
    .btn--half { justify-content: center; gap: 10px; padding: 0 12px; }
    .btn.btn--half span { flex: none; }

    /* Hover jen na zařízeních s myší (na dotyku by „zůstal viset“) */
    @media (hover: hover) {
      .btn:hover { background: var(--card-hover); }
      .btn--primary:hover { background: var(--primary-hover); }
      .btn--spotify:hover { background: #3BE477; border-color: #3BE477; }
      .btn--opgg:hover { background: #3A66C4; border-color: #3A66C4; }
    }

    /* Skryté odkazy pod heslem */
    .extra { width: 100%; margin-top: 12px; }
    .lock {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted-fg);
      font: 600 15px/1 var(--font);
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }
    .lock svg { width: 18px; height: 18px; flex: none; }
    .lock[aria-expanded="true"] { color: var(--fg); border-color: var(--muted-fg); }
    .lock:focus-visible, .lock-form input:focus-visible, .lock-submit:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
    @media (hover: hover) { .lock:hover { color: var(--fg); border-color: var(--muted-fg); } }

    .lock-form { margin-top: 12px; text-align: left; animation: rise .3s ease both; }
    .lock-form label { display: block; margin: 0 0 6px 4px; font-size: 14px; font-weight: 600; color: var(--muted-fg); }
    .lock-row { display: flex; gap: 8px; }
    .lock-form input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--fg);
      font: 16px var(--font); /* 16 px = iPhone při psaní nezoomuje */
    }
    .lock-form input[aria-invalid="true"] { border-color: #DC2626; }
    .lock-submit {
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: var(--on-primary);
      font: 600 15px var(--font);
      cursor: pointer;
    }
    .lock-submit:disabled { opacity: .6; cursor: progress; }
    .lock-error { min-height: 20px; margin: 6px 0 0 4px; font-size: 14px; color: #DC2626; }
    @media (prefers-color-scheme: dark) {
      .lock-error { color: #F87171; }
      .lock-form input[aria-invalid="true"] { border-color: #F87171; }
    }
    .shake { animation: shake .35s ease; }
    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .extra-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .extra-links .btn { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
    .extra-links .btn + .btn { animation-delay: .06s; }

    .btn svg { flex: none; width: 22px; height: 22px; }
    .btn span { flex: 1; text-align: left; }
    .btn .chev { width: 18px; height: 18px; opacity: .45; transition: transform .25s ease, opacity .25s ease; }
    .btn:active .chev { transform: translateX(4px); opacity: .9; }
    @media (hover: hover) {
      .btn:hover .chev { transform: translateX(4px); opacity: .9; }
    }

    footer {
      margin-top: 40px;
      color: var(--muted-fg);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      max-width: calc(100% - 40px);
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 15px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Jemný nástup obsahu */
    .reveal { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
    .actions li:nth-child(1) { animation-delay: .08s; }
    .actions li:nth-child(2) { animation-delay: .12s; }
    .actions li:nth-child(3) { animation-delay: .16s; }
    .actions li:nth-child(4) { animation-delay: .20s; }
    .extra.reveal { animation-delay: .24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .lock-form, .extra-links .btn, .shake { animation: none; }
      .btn, .btn .chev, .toast, .lock { transition: none; }
      .avatar::before, .avatar::after, .btn--spotify::after { display: none; }
    }
  </style>
</head>

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var submit = form.querySelector('.lock-submit');
        submit.disabled = true;
        err.textContent = '';
        try {
          links.innerHTML = await decrypt(pw.value.trim());
          links.hidden = false;
          form.hidden = true;
          lockBtn.hidden = true;
        } catch (_) {
          err.textContent = 'Špatné heslo, zkus to znovu.';
          pw.setAttribute('aria-invalid', 'true');
          row.classList.remove('shake');
          void row.offsetWidth;
          row.classList.add('shake');
          pw.select();
        } finally {
          submit.disabled = false;
        }
      });
      pw.addEventListener('input', function () { pw.removeAttribute('aria-invalid'); err.textContent = ''; });
      // iOS Safari zobrazí :active (stisk tlačítka) jen s posluchačem dotyku
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
</body>
</html>
